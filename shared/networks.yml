networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-docker-services}_default
  t3_proxy:
    name: ${COMPOSE_PROJECT_NAME:-docker-services}_t3_proxy
    driver: bridge
  socket_proxy:
    name: ${COMPOSE_PROJECT_NAME:-docker-services}_socket_proxy
    driver: bridge
    internal: true
  ipv6_proxy:
    name: ${COMPOSE_PROJECT_NAME:-docker-services}_ipv6_proxy
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:dead:beef:ff00::/64

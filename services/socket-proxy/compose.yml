# https://github.com/linuxserver/docker-socket-proxy
services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    networks:
      socket_proxy:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOG_LEVEL: warning
      # ── Granted ──────────────────────────────────────────────
      EVENTS: 1
      PING: 1
      VERSION: 1
      # ── Traefik needs ───────────────────────────────────────
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      VOLUMES: 1
      INFO: 1
      # ── Service management ──────────────────────────────────
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      POST: 1
      # ── Revoked ─────────────────────────────────────────────
      AUTH: 0
      SECRETS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0

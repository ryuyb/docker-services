# https://doc.traefik.io/traefik/
services:
  traefik:
    image: traefik:3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - socket-proxy
    networks:
      t3_proxy:
      socket_proxy:
    # ── Entrypoints ──────────────────────────────────────────────
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    command:
      # ── Global ─────────────────────────────────────────────────
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false
      # ── Entrypoints ────────────────────────────────────────────
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.traefik.address=:8080
      # ── HTTP → HTTPS redirect ─────────────────────────────────
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # ── Dashboard ──────────────────────────────────────────────
      - --api=true
      - --api.dashboard=true
      # ── Forwarded headers (Cloudflare trusted IPs) ─────────────
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${CLOUDFLARE_IPS:-},${LOCAL_IPS:-}
      # ── Logging ────────────────────────────────────────────────
      - --log=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-WARN}
      - --accessLog=true
      - --accessLog.filePath=/logs/access.log
      - --accessLog.bufferingSize=100
      - --accessLog.filters.statusCodes=204-299,400-499,500-599
      # ── Docker provider (via Socket Proxy) ─────────────────────
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=t3_proxy
      # ── File provider (dynamic config) ─────────────────────────
      - --providers.file.directory=/rules
      - --providers.file.watch=true
      # ── TLS (wildcard cert) ───────────────────────────────────
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.options=tls-opts@file
      - --entrypoints.websecure.http.tls.certresolver=dns-cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAINNAME_1}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAINNAME_1}
      # ── ACME (Let's Encrypt via Cloudflare DNS) ────────────────
      # Staging server for testing:
      # - --certificatesResolvers.dns-cloudflare.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesResolvers.dns-cloudflare.acme.email=${ACME_EMAIL:-}
      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.propagation.delaybeforechecks=120
    volumes:
      - ${CONFIG_DIR:-./config}/traefik/rules:/rules
      - ${DATA_DIR:-./data}/traefik/acme/acme.json:/acme.json
      - ${DATA_DIR:-./data}/traefik/logs:/logs
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
      DOMAINNAME_1: ${DOMAINNAME_1:-}
    secrets:
      - cf_dns_api_token
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-rtr.entrypoints=websecure"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.${DOMAINNAME_1:-localhost}`)"
      - "traefik.http.routers.traefik-rtr.service=api@internal"

secrets:
  cf_dns_api_token:
    file: ${SECRETS_DIR:-./secrets}/cf_dns_api_token
